<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none">

  <!-- Dark pill background so text is always readable on any bg -->
  <rect x="0" y="0" width="220" height="56" rx="10" fill="#1a1a2e"/>

  <!-- Hexagon frame in amber/gold -->
  <polygon
    points="28,6 48,6 58,22 48,38 28,38 18,22"
    stroke="#f0a500"
    stroke-width="3"
    fill="none"
    stroke-linejoin="round"
  />

  <!-- Stylised interlocking hands -->
  <path
    d="M25,29 C25,20 32,15 38,19 C44,23 44,30 38,32 C32,34 25,29 25,29Z"
    fill="#f0a500"
    opacity="0.9"
  />
  <path
    d="M50,17 C50,26 43,31 37,27 C31,23 31,16 37,14 C43,12 50,17 50,17Z"
    fill="#ffffff"
    opacity="0.9"
  />

  <!-- "Washika" in white -->
  <text
    x="70"
    y="25"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="16"
    fill="#ffffff"
    letter-spacing="0.3"
  >Washika</text>

  <!-- "DAU" in amber -->
  <text
    x="70"
    y="43"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="14"
    fill="#f0a500"
    letter-spacing="2.5"
  >DAU</text>

</svg>
